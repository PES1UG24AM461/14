name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  client:
    name: Lint, test and build (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w client

      # OQS-20: tests with an 80% statement coverage gate (NFR-007, FR-031)
      - name: Test with coverage
        run: npm run test:ci -w client

      - name: Build
        run: npm run build -w client

      - name: Lint report
        if: always()
        run: npx eslint . --format json --output-file reports/eslint.json || true
        working-directory: client

      # FR-030: test, coverage and lint reports as downloadable artifacts
      - name: Upload client reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-reports
          path: |
            client/reports/
            client/coverage/
          retention-days: 14

  server:
    name: Lint, test and build (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w server

      # OQS-20: tests with an 80% statement coverage gate (NFR-007, FR-031)
      - name: Test with coverage
        run: npm run test:ci -w server

      - name: Check server syntax
        run: node --check server/src/server.js

      # SEC-006: high or critical advisories fail the run; the full report is kept as an artifact.
      - name: Dependency audit
        run: |
          mkdir -p server/reports
          npm audit --json > server/reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Lint report
        if: always()
        run: npx eslint . --format json --output-file reports/eslint.json || true
        working-directory: server

      # FR-030: test, coverage, lint and audit reports as downloadable artifacts
      - name: Upload server reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-reports
          path: |
            server/reports/
            server/coverage/
          retention-days: 14
